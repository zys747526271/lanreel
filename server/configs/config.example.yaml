# LanReel 服务端示例配置
# 复制为 config.yaml 后修改；所有项均可用环境变量覆盖（见 README 部署说明）。
server:
  host: 0.0.0.0
  port: 8080
  tls:
    enabled: false
    cert_file: ""
    key_file: ""
  trusted_proxies: []

media:
  # 支持配置多个媒体根目录（F-06）
  roots:
    - "D:/Media"
  video_extensions: [".mp4", ".webm", ".mov", ".m4v", ".ogv"]
  image_extensions: [".jpg", ".jpeg", ".png", ".webp", ".gif", ".avif"]
  # 定时重扫间隔（秒），0 表示仅在启动时扫描
  scan_interval_seconds: 60
  # 图片自动切换停留时长（秒）
  image_display_seconds: 5
  ignored_dirs: [".git", "node_modules", "@eaDir", "#recycle"]
  # 说明：封面不再由服务端生成；浏览器在收藏夹/历史页自动抽帧并缓存（无需 ffmpeg）。
  # 文件系统监听：目录变化后去抖触发扫描；定时扫描仍作为兜底
  watch_enabled: true
  watch_debounce_seconds: 2
  watch_max_dirs: 4096

database:
  path: "./data/lanreel.db"

logging:
  path: "./data/logs.db"
  fallback_dir: "./data/logs"
  level: "info"
  retention_days: 30
  max_entries: 200000
  frontend_upload_enabled: false

auth:
  # 预置管理员的用户名（仅在提供 init_password / ADMIN_INIT_PASSWORD 时用于创建）
  # 默认留空密码：首次访问网页时由引导页创建管理员，用户名可自行指定
  username: "admin"
  # 可选：填写后启动即创建管理员并跳过网页初始化；留空则走网页引导
  # 如需重置已有管理员密码，配合 --reset-admin-password 使用（建议用环境变量提供）
  init_password: ""
  # 留空则自动生成并保存到 {data_dir}/jwt.secret
  jwt_secret: ""
  access_ttl_minutes: 120
  refresh_ttl_hours: 720
  # 登录失败限流：窗口内失败次数达到上限后锁定指定分钟
  login_max_attempts: 5
  login_window_minutes: 5
  login_lock_minutes: 5

app:
  timezone: "Asia/Shanghai"
  data_dir: "./data"
  # 前端静态资源目录；留空则使用二进制内嵌资源
  web_dir: ""
  registration_open: true
  # 媒体源标识，参与 video_key 计算
  source_id: "local"
